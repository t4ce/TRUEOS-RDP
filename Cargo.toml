[package]
name = "trueos-rdp"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
bytemuck = { version = "1.25.0", features = ["derive"] }
futures = "0.3.32"
microfont = "3.7.8"
winit = "0.30.13"

[target.'cfg(target_os = "linux")'.dependencies]
wgpu = { version = "30.0", default-features = false, features = ["vulkan", "wgsl"] }

[target.'cfg(target_os = "macos")'.dependencies]
wgpu = { version = "30.0", default-features = false, features = ["metal", "wgsl"] }

[target.'cfg(target_os = "windows")'.dependencies]
wgpu = { version = "30.0", default-features = false, features = ["dx12", "wgsl"] }

[profile.release]
codegen-units = 1           # reduces binary size by ~2%
debug = "line-tables-only"  # Keep lightweight symbols for backtraces in release
lto = true                  # reduces binary size by ~14%
opt-level = 3               # maximizes runtime performance, may increase binary size
panic = "abort"             # reduces binary size by ~50% in combination with -Zbuild-std-features=panic_immediate_abort
split-debuginfo = "packed"  # generates a separate *.dwp/*.dSYM so the binary can get stripped
strip = "symbols"           # See split-debuginfo - allows us to drop the size by ~65%
incremental = true          # Improves re-compile times
